<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up - Mockable</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary": "#3f6700",
                      "primary-container": "#8455ef",
                      "outline-variant": "#cbc3d7",
                      "on-secondary-container": "#fffbff",
                      "on-tertiary-fixed": "#102000",
                      "surface-dim": "#dcdad6",
                      "surface-container-high": "#eae8e4",
                      "on-tertiary": "#ffffff",
                      "primary": "#6b38d4",
                      "on-tertiary-fixed-variant": "#304f00",
                      "tertiary-container": "#518200",
                      "secondary": "#b90538",
                      "on-primary-fixed": "#23005c",
                      "on-tertiary-container": "#f9ffea",
                      "secondary-container": "#dc2c4f",
                      "on-error": "#ffffff",
                      "error-container": "#ffdad6",
                      "inverse-surface": "#31302e",
                      "surface-container": "#f0ede9",
                      "on-surface-variant": "#494454",
                      "on-background": "#1c1c1a",
                      "on-surface": "#1c1c1a",
                      "secondary-fixed": "#ffdadb",
                      "background": "#fcf9f5",
                      "on-secondary-fixed": "#40000d",
                      "surface-variant": "#e5e2de",
                      "tertiary-fixed": "#acf847",
                      "on-primary-fixed-variant": "#5516be",
                      "on-secondary": "#ffffff",
                      "on-primary-container": "#fffbff",
                      "on-error-container": "#93000a",
                      "inverse-primary": "#d0bcff",
                      "inverse-on-surface": "#f3f0ec",
                      "surface-bright": "#fcf9f5",
                      "outline": "#7b7486",
                      "error": "#ba1a1a",
                      "surface-tint": "#6d3bd7",
                      "tertiary-fixed-dim": "#91db2a",
                      "surface-container-low": "#f6f3ef",
                      "secondary-fixed-dim": "#ffb2b7",
                      "on-primary": "#ffffff",
                      "primary-fixed-dim": "#d0bcff",
                      "primary-fixed": "#e9ddff",
                      "surface-container-lowest": "#ffffff",
                      "surface-container-highest": "#e5e2de",
                      "surface": "#fcf9f5",
                      "on-secondary-fixed-variant": "#92002a"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {
                      "md": "24px",
                      "base": "8px",
                      "lg": "48px",
                      "margin-mobile": "16px",
                      "xl": "80px",
                      "margin-desktop": "64px",
                      "sm": "12px",
                      "gutter": "24px",
                      "xs": "4px"
              },
              "fontFamily": {
                      "body-lg": ["Inter"],
                      "body-md": ["Inter"],
                      "headline-xl": ["Plus Jakarta Sans"],
                      "headline-md": ["Plus Jakarta Sans"],
                      "headline-sm": ["Plus Jakarta Sans"],
                      "label-md": ["Inter"],
                      "headline-lg-mobile": ["Plus Jakarta Sans"],
                      "headline-lg": ["Plus Jakarta Sans"],
                      "headline-xl-mobile": ["Plus Jakarta Sans"]
              },
              "fontSize": {
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "headline-xl": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                      "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                      "headline-xl-mobile": ["36px", {"lineHeight": "44px", "fontWeight": "800"}]
              }
            }
          }
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .bg-gradient-brand {
                @apply bg-gradient-to-br from-primary-fixed-dim/40 via-surface to-secondary-fixed-dim/30;
            }
            .shadow-ambient {
                box-shadow: 0 20px 40px -10px rgba(107, 56, 212, 0.08), 0 10px 20px -5px rgba(107, 56, 212, 0.04);
            }
        }
    </style>
</head>
<body class="h-full bg-background bg-gradient-brand flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-on-surface antialiased">
<!-- Main Container -->
<main class="w-full max-w-[480px]">
<!-- Glassmorphism Card -->
<div class="bg-surface/90 backdrop-blur-xl rounded-xl shadow-ambient border border-surface-variant p-lg flex flex-col gap-md relative overflow-hidden">
<!-- Decorative blur elements -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-primary/10 rounded-full blur-2xl pointer-events-none"></div>
<div class="absolute -bottom-10 -left-10 w-32 h-32 bg-secondary/10 rounded-full blur-2xl pointer-events-none"></div>
<!-- Header -->
<div class="text-center space-y-sm relative z-10">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container text-on-primary-container mb-sm">
<span class="material-symbols-outlined text-headline-xl" style="font-variation-settings: 'FILL' 1;">record_voice_over</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Mockable</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create your account to start practicing.</p>
</div>
<!-- Form -->
<form class="space-y-md relative z-10 mt-sm">
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface block" for="email">Email</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">mail</span>
</span>
<input class="w-full pl-[40px] pr-sm py-[14px] bg-surface-container-low border border-outline-variant rounded-DEFAULT font-body-md text-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none" id="email" name="email" placeholder="you@example.com" type="email"/>
</div>
</div>
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface block" for="password">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</span>
<input class="w-full pl-[40px] pr-sm py-[14px] bg-surface-container-low border border-outline-variant rounded-DEFAULT font-body-md text-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="w-full py-[16px] px-md rounded-full bg-gradient-to-r from-primary to-secondary text-on-primary font-label-md text-label-md hover:scale-[1.02] hover:shadow-lg transition-all duration-300 flex items-center justify-center gap-base mt-lg" type="submit">
                    Create Account
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer -->
<div class="text-center pt-md border-t border-surface-variant relative z-10 mt-sm">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-semibold hover:text-secondary transition-colors underline decoration-transparent hover:decoration-secondary underline-offset-4" href="#">Sign In</a>
</p>
</div>
</div>
</main>
<script>
        // Simple micro-interaction for input fields
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.querySelector('.material-symbols-outlined').classList.add('text-primary');
                this.parentElement.querySelector('.material-symbols-outlined').classList.remove('text-outline');
            });
            input.addEventListener('blur', function() {
                this.parentElement.querySelector('.material-symbols-outlined').classList.remove('text-primary');
                this.parentElement.querySelector('.material-symbols-outlined').classList.add('text-outline');
            });
        });
    </script>
</body></html>
