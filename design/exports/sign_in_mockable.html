<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign In - Mockable</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#3f6700",
                        "primary-container": "#8455ef",
                        "outline-variant": "#cbc3d7",
                        "on-secondary-container": "#fffbff",
                        "on-tertiary-fixed": "#102000",
                        "surface-dim": "#dcdad6",
                        "surface-container-high": "#eae8e4",
                        "on-tertiary": "#ffffff",
                        "primary": "#6b38d4",
                        "on-tertiary-fixed-variant": "#304f00",
                        "tertiary-container": "#518200",
                        "secondary": "#b90538",
                        "on-primary-fixed": "#23005c",
                        "on-tertiary-container": "#f9ffea",
                        "secondary-container": "#dc2c4f",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "inverse-surface": "#31302e",
                        "surface-container": "#f0ede9",
                        "on-surface-variant": "#494454",
                        "on-background": "#1c1c1a",
                        "on-surface": "#1c1c1a",
                        "secondary-fixed": "#ffdadb",
                        "background": "#fcf9f5",
                        "on-secondary-fixed": "#40000d",
                        "surface-variant": "#e5e2de",
                        "tertiary-fixed": "#acf847",
                        "on-primary-fixed-variant": "#5516be",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#fffbff",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#d0bcff",
                        "inverse-on-surface": "#f3f0ec",
                        "surface-bright": "#fcf9f5",
                        "outline": "#7b7486",
                        "error": "#ba1a1a",
                        "surface-tint": "#6d3bd7",
                        "tertiary-fixed-dim": "#91db2a",
                        "surface-container-low": "#f6f3ef",
                        "secondary-fixed-dim": "#ffb2b7",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#d0bcff",
                        "primary-fixed": "#e9ddff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#e5e2de",
                        "surface": "#fcf9f5",
                        "on-secondary-fixed-variant": "#92002a"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "24px",
                        "base": "8px",
                        "lg": "48px",
                        "margin-mobile": "16px",
                        "xl": "80px",
                        "margin-desktop": "64px",
                        "sm": "12px",
                        "gutter": "24px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-xl": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "headline-sm": ["Plus Jakarta Sans"],
                        "label-md": ["Inter"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-xl-mobile": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-xl": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-xl-mobile": ["36px", { "lineHeight": "44px", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center relative overflow-hidden font-body-md text-on-surface">
<!-- Decorative Background Gradients -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[20%] -left-[10%] w-[70%] h-[70%] rounded-full bg-gradient-to-br from-primary-fixed to-transparent opacity-50 blur-[100px]"></div>
<div class="absolute bottom-[0%] -right-[10%] w-[60%] h-[60%] rounded-full bg-gradient-to-tl from-secondary-fixed to-transparent opacity-50 blur-[80px]"></div>
</div>
<!-- Sign In Card -->
<div class="relative z-10 w-full max-w-md px-margin-mobile md:px-0">
<div class="bg-surface rounded-xl border border-surface-variant shadow-[0px_30px_50px_rgba(107,56,212,0.08)] p-lg flex flex-col items-center">
<!-- Brand Logo -->
<div class="mb-md">
<span class="font-headline-md text-headline-md font-extrabold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">Mockable</span>
</div>
<!-- Header -->
<div class="text-center mb-lg">
<h1 class="font-headline-sm text-headline-sm text-on-surface mb-xs">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to continue your prep.</p>
</div>
<!-- Form -->
<form class="w-full flex flex-col gap-md">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="w-full pl-lg pr-sm py-sm bg-surface-container-lowest border border-outline-variant rounded-DEFAULT focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full pl-lg pr-sm py-sm bg-surface-container-lowest border border-outline-variant rounded-DEFAULT focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="mt-sm w-full bg-gradient-to-r from-primary to-secondary text-on-primary font-label-md text-label-md py-sm px-md rounded-full shadow-[0px_10px_20px_rgba(107,56,212,0.15)] hover:scale-[1.02] hover:shadow-[0px_15px_25px_rgba(107,56,212,0.25)] transition-all duration-200 flex justify-center items-center gap-sm" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer Link -->
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors ml-xs" href="#">Sign Up</a>
</p>
</div>
</div>
</div>
</body></html>
